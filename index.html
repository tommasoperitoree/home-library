<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C3D2E">
<title>Home Library</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app" class="app">
  <header class="topbar">
    <h1 id="tab-title">Catalogo</h1>
  </header>

  <main id="tab-io" class="tab-panel hidden"></main>
  <main id="tab-catalogo" class="tab-panel"></main>
  <main id="tab-prestiti" class="tab-panel hidden"></main>
  <main id="tab-famiglia" class="tab-panel hidden"></main>

  <nav class="bottom-nav">
    <button class="nav-btn" data-tab="io">
      <span class="nav-icon">📖</span><span class="nav-label">Io</span>
    </button>
    <button class="nav-btn active" data-tab="catalogo">
      <span class="nav-icon">🔍</span><span class="nav-label">Catalogo</span>
    </button>
    <button class="nav-btn" data-tab="prestiti">
      <span class="nav-icon">📤</span><span class="nav-label">Prestiti</span>
    </button>
    <button class="nav-btn" data-tab="famiglia">
      <span class="nav-icon">👨‍👩‍👦</span><span class="nav-label">Famiglia</span>
    </button>
  </nav>
</div>

<div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
<div id="bottom-sheet" class="bottom-sheet hidden">
  <div class="sheet-handle"></div>
  <div id="sheet-content" class="sheet-content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
